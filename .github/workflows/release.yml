name: Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            publish:
                description: "Publish to VS Code Marketplace"
                required: true
                default: true
                type: boolean
            create_release:
                description: "Create GitHub Release"
                required: true
                default: true
                type: boolean

jobs:
    release:
        name: Build and Release
        runs-on: ubuntu-latest
        permissions:
            contents: write
            # Trusted Publishing: lets vsce and ovsx exchange a GitHub OIDC token
            # for a short-lived registry credential, so no PAT secrets are needed.
            id-token: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22.x"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Compile TypeScript
              run: npm run compile

            - name: Test
              run: npm test

            - name: Integration test
              run: xvfb-run -a npm run test:integration

            - name: Get version from package.json
              id: package_version
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  echo "version=$VERSION" >> $GITHUB_OUTPUT
                  echo "tag=v$VERSION" >> $GITHUB_OUTPUT

            # ONE universal package — deliberately not platform-specific.
            #
            # Publishing Linux-only targets looked like a neat way to hide the
            # extension where it cannot work. It isn't: in WSL and Remote-SSH the
            # extension runs on the Linux REMOTE, but the VSCode CLIENT is Windows
            # or macOS ("clientTargetPlatform":"win32-x64" in its own install log)
            # — and the client is what resolves the Marketplace. With no win32
            # package and no universal one, it finds no compatible version, decides
            # the extension is gone ("This extension is no longer available on the
            # Extension Marketplace") and never offers an update. That hit exactly
            # the users this extension is FOR.
            #
            # There is no native code here, so a platform-specific build buys
            # nothing anyway. The platform requirement is enforced where it belongs —
            # at runtime, by the inert mode in extension.ts.
            - name: Package extension (universal)
              run: npx @vscode/vsce package

            - name: Create GitHub Release (on tag push)
              uses: softprops/action-gh-release@v2
              if: startsWith(github.ref, 'refs/tags/')
              with:
                  files: "*.vsix"
                  name: "Claude Alts ${{ github.ref_name }}"
                  generate_release_notes: true
                  draft: false
                  prerelease: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Create GitHub Release (manual trigger)
              uses: softprops/action-gh-release@v2
              if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'
              with:
                  files: "*.vsix"
                  tag_name: ${{ steps.package_version.outputs.tag }}
                  name: "Claude Alts ${{ steps.package_version.outputs.tag }}"
                  generate_release_notes: true
                  draft: false
                  prerelease: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # One universal .vsix, published by path to both registries.
            # Authenticates via the Marketplace Trusted Publishing policy for
            # supat-roong/claude-alts + release.yml — no PAT.
            - name: Publish to VS Code Marketplace
              if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.publish == 'true'
              run: |
                  for f in *.vsix; do
                    npx @vscode/vsce publish --oidc --packagePath "$f"
                  done

            # Open VSX Trusted Publishing (open-vsx.org → Settings → Trusted
            # Publishers). ovsx exchanges the job's OIDC token automatically
            # when no access token is set. Open VSX only allows registering an
            # extension that already has a version, so the very first publish
            # needs the OVSX_PAT secret; once trusted publishing is registered,
            # delete that secret. (If set, the PAT takes precedence.)
            - name: Publish to Open VSX Registry
              if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.publish == 'true'
              run: |
                  for f in *.vsix; do
                    npx ovsx publish "$f"
                  done
              env:
                  OVSX_PAT: ${{ secrets.OVSX_PAT }}
