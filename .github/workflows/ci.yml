name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:

jobs:
    test:
        name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
                # 24 is what VS Code runs the uninstall hook with; its rmSync
                # behaves differently on Windows junctions than 22's.
                node: ["22.x", "24.x"]
        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Compile TypeScript
              run: npm run compile

            # Includes the generated shell helpers run in bash/zsh, pwsh, and on
            # Windows also Windows PowerShell 5.1.
            - name: Test
              run: npm test

            # A real VS Code: activation, commands, and the inert mode beside
            # Claude Parallel Accounts. Linux has no display, so it gets a virtual one.
            - name: Integration test (Linux)
              if: runner.os == 'Linux' && matrix.node == '22.x'
              run: xvfb-run -a npm run test:integration

            - name: Integration test
              if: runner.os != 'Linux' && matrix.node == '22.x'
              run: npm run test:integration

    package:
        name: Package
        needs: test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22.x"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Package extension
              run: npx @vscode/vsce package

            - name: Upload VSIX artifact
              uses: actions/upload-artifact@v4
              with:
                  name: vsix-package
                  path: "*.vsix"
                  retention-days: 30
