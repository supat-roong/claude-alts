<svg width="128" height="128" viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- One account card in local coordinates: centred on 0,0. -->
    <symbol id="person" overflow="visible">
      <circle cx="0" cy="-96" r="83"/>
      <path d="M -146 141 C -146 40 -70 2 0 2 C 70 2 146 40 146 141 Q 146 152 135 152 L -135 152 Q -146 152 -146 141 Z"/>
    </symbol>
  </defs>
  <rect x="0" y="0" width="1200" height="1200" rx="250" fill="#F5EEE2"/>
  <g transform="translate(-29 -30)">
    <!-- back card -->
    <g transform="translate(400 585) rotate(-22)">
      <rect x="-200" y="-240" width="400" height="480" rx="52" fill="#504232"/>
      <use href="#person" xlink:href="#person" fill="#FBF4E7" transform="scale(0.88)"/>
    </g>
    <!-- middle card -->
    <g transform="translate(612 586) rotate(-14)">
      <rect x="-218" y="-262" width="436" height="524" rx="54" fill="#000" fill-opacity="0.07" transform="translate(-10 0)"/>
      <rect x="-218" y="-262" width="436" height="524" rx="54" fill="#ECB796"/>
      <use href="#person" xlink:href="#person" fill="#FBF4E7" transform="scale(0.92)"/>
    </g>
    <!-- front card -->
    <g transform="translate(838 668) rotate(11)">
      <rect x="-235" y="-297" width="470" height="594" rx="58" fill="#000" fill-opacity="0.08" transform="translate(-12 0)"/>
      <rect x="-235" y="-297" width="470" height="594" rx="58" fill="#DB7F52"/>
      <use href="#person" xlink:href="#person" fill="#FBF4E7"/>
    </g>
  </g>
</svg>
